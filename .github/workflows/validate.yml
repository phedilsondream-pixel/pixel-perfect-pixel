name: Validate Nexora

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "nexora/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test
      - name: Run lint
        run: bun run lint
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Build production app
        run: bun run build
